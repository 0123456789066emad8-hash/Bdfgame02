<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Defense</title>
<style>
body { margin:0; display:flex; flex-direction:column; align-items:center;
  background:linear-gradient(45deg,#ff007f,#00d2ff,#7f00ff);
  background-size:300% 300%; animation:bgGrad 8s ease infinite;
  color:white; font-family:Tahoma,sans-serif; min-height:100vh;
  overflow:hidden; -webkit-user-select:none; user-select:none; }
@keyframes bgGrad {
  0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
}
:root { --bg-color:rgba(0,0,0,0.85); --text-color:white; }
.info-bar {
  width:100%; display:flex; align-items:center;
  justify-content:space-between; padding:10px 20px;
  background:rgba(0,0,0,0.4); box-sizing:border-box; flex-shrink:0;
}
.hamburger {
  display:flex; flex-direction:column; gap:4px;
  cursor:pointer; width:28px;
}
.hamburger span {
  display:block; width:24px; height:2px;
  background:white; border-radius:2px; transition:0.2s;
}
.game-container { position:relative; margin-top:20px; }
#gameCanvas {
  background:rgba(0,0,0,0.5); border:2px solid #fff;
  border-radius:10px; display:block;
}
.menu-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:var(--bg-color); color:var(--text-color);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:10; border-radius:10px;
}
.theme-dark { --bg-color:rgba(0,0,0,0.9); --text-color:white; }
.theme-neon {
  --bg-color:rgba(10,20,40,0.9); --text-color:#00ff88;
  border:1px solid #00ff88;
}
.hidden { display:none !important; }
.btn {
  padding:8px 12px; margin:5px; border:1px solid currentColor;
  border-radius:8px; cursor:pointer; background:transparent;
  color:inherit; font-size:14px; touch-action:manipulation;
}
.controls { display:flex; gap:20px; margin-top:20px; }
.ctrl-btn {
  padding:15px 25px; background:rgba(255,255,255,0.2);
  border:2px solid white; border-radius:12px;
  cursor:pointer; font-size:24px; touch-action:manipulation;
}
.lang-bar {
  width:100%; margin-top:auto; background:#555;
  padding:12px 14px; display:flex; align-items:center;
  border-top:1px solid #444; box-sizing:border-box; flex-shrink:0;
}
.footer-text { flex:1; text-align:center; }
.footer-text .main { font-size:14px; font-weight:700; }
.footer-text .sub { font-size:11px; opacity:0.75; margin-top:2px; }
#currentFlag { font-size:28px; cursor:pointer; padding:4px 6px; }
.side-backdrop {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); z-index:99; opacity:0;
  pointer-events:none; transition:opacity 0.3s ease;
}
.side-backdrop.open { opacity:1; pointer-events:auto; }
.side-menu {
  position:fixed; top:0; left:-320px; width:300px; height:100%;
  background:linear-gradient(180deg,#0d1b2a 0%,#1b2838 50%,#0d1b2a 100%);
  z-index:100; transition:left 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y:auto; display:flex; flex-direction:column;
  box-shadow:4px 0 20px rgba(0,0,0,0.5);
}
.side-menu.open { left:0; }
.side-menu-header {
  padding:30px 24px 20px; border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; flex-direction:column; align-items:center;
}
.brand-logo {
  font-size:26px; font-weight:900; color:#4da6ff;
  letter-spacing:2px; font-family:'Segoe UI',Arial,sans-serif;
  display:flex; align-items:center; gap:8px;
}
.brand-logo .icon {
  width:28px; height:28px; border:2px solid #4da6ff; border-radius:4px; position:relative;
}
.brand-logo .icon::before {
  content:''; position:absolute; top:3px; left:3px;
  width:10px; height:10px;
  border:2px solid #4da6ff; border-right:none; border-bottom:none;
}
.side-menu-items { padding:16px 0; display:flex; flex-direction:column; align-items:center; }
.side-item {
  width:85%; padding:16px 20px; color:#fff; font-size:18px;
  font-weight:500; cursor:pointer; display:flex; align-items:center;
  gap:14px; border-radius:8px; margin:4px 0; transition:background 0.2s;
}
.side-item:hover { background:rgba(77,166,255,0.1); }
.side-item .ico { font-size:20px; width:30px; text-align:center; }
#levelDisplay {
  background:linear-gradient(90deg,#ff6b35,#ff3860);
  color:white; padding:4px 10px; border-radius:8px;
  font-size:13px; font-weight:bold; margin-left:8px;
}
@keyframes levelUp {
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>
<body>

<div class="info-bar">
  <span id="scoreDisplay" style="font-weight:bold">امتیاز: 0</span>
  <span id="levelDisplay">مرحله: 1</span>
  <span id="brand" style="color:#4da6ff;font-weight:900;letter-spacing:1px;font-family:'Segoe UI',Arial,sans-serif">Bdfgame</span>
  <div class="hamburger" onclick="openSideMenu()"><span></span><span></span><span></span></div>
</div>

<div class="game-container">
  <canvas id="gameCanvas" width="300" height="300"></canvas>
  <div id="mainMenu" class="menu-overlay">
    <h2 id="msg">دفاع فضایی</h2>
    <button class="btn" onclick="startGame()" id="startBtn">شروع بازی</button>
  </div>
  <div id="settingsPanel" class="menu-overlay hidden">
    <h3 id="setTxt">تنظیمات</h3>
    <div>
      <button class="btn" onclick="setLang('fa')" id="langFaBtn">فارسی</button>
      <button class="btn" onclick="setLang('ar')" id="langArBtn">العربیه</button>
      <button class="btn" onclick="setLang('en')" id="langEnBtn">English</button>
    </div>
    <div style="margin-top:10px">
      <button class="btn" onclick="setTheme('theme-dark')" id="themeDarkBtn">تیره</button>
      <button class="btn" onclick="setTheme('theme-neon')" id="themeNeonBtn">نئون</button>
    </div>
    <button class="btn" onclick="resetProgress()" id="resetBtn">🔄 شروع مجدد</button>
    <button class="btn" onclick="closeSettings()" id="backBtn">بازگشت</button>
  </div>
  <div id="helpPanel" class="menu-overlay hidden">
    <h3 id="helpTxt">راهنما</h3>
    <p id="helpContent" style="text-align:center;line-height:1.8;max-width:85%;margin-top:12px;font-size:15px">
      مربع‌های قرمز (دشمنان) را نابود کنید و امتیاز بگیرید
    </p>
    <button class="btn" onclick="closeHelp()" id="helpBackBtn" style="margin-top:16px">بازگشت</button>
  </div>
</div>

<div class="controls">
  <div class="ctrl-btn" id="leftBtn">◀️</div>
  <div class="ctrl-btn" id="shootBtn">🚀</div>
  <div class="ctrl-btn" id="rightBtn">▶️</div>
</div>

<div class="lang-bar">
  <div style="width:40px"></div>
  <div class="footer-text">
    <div id="footerTitle" class="main">دفاع فضایی</div>
    <div id="footerContributors" class="sub">مشارکت کنندگان</div>
  </div>
  <div style="width:40px;text-align:left">
    <span id="currentFlag" onclick="openLangMenu()">🇮🇷</span>
  </div>
</div>

<div id="langMenu" class="menu-overlay hidden">
  <h3 id="langTitle">انتخاب زبان</h3>
  <div style="display:flex;gap:30px;flex-wrap:wrap;justify-content:center">
    <button class="btn" onclick="selectLang('fa')" style="font-size:36px">🇮🇷</button>
    <button class="btn" onclick="selectLang('ar')" style="font-size:36px">🇵🇸</button>
    <button class="btn" onclick="selectLang('en')" style="font-size:36px">🇺🇸</button>
  </div>
  <button class="btn" onclick="closeLangMenu()" id="langCloseBtn" style="margin-top:20px">بستن</button>
</div>

<div class="side-backdrop" id="sideBackdrop" onclick="closeSideMenu()"></div>
<div class="side-menu" id="sideMenu">
  <div class="side-menu-header">
    <div class="brand-logo">
      <span class="icon"></span>
      <span>Bdfgame</span>
    </div>
  </div>
  <div class="side-menu-items">
    <div class="side-item" id="sideReturn" onclick="returnToMenu()">
      <span class="ico">🎮</span><span>بازگشت به منوی بازی</span>
    </div>
    <div class="side-item" id="sideSettings" onclick="openSettings()">
      <span class="ico">⚙️</span><span>تنظیمات</span>
    </div>
    <div class="side-item" id="sideHelp" onclick="openHelp()">
      <span class="ico">📖</span><span>راهنما</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let playerX = 130, score = 0, isRunning = false, currentLang = 'fa', level = 1;
let enemies = [], bullets = [];
let keys = {l:false, r:false};
let playerY = 280;
const SCORE_PER_LEVEL = 50;
window.enemySpeed = 1.5;
window.spawnRate = 1100;

const trans = {
  fa: {
    title:"دفاع فضایی", score:"امتیاز", start:"شروع بازی",
    settings:"تنظیمات", help:"راهنما",
    sideReturn:"بازگشت به منوی بازی", sideSettings:"تنظیمات", sideHelp:"راهنما",
    resetBtn:"🔄 شروع مجدد", backBtn:"بازگشت",
    langFa:"فارسی", langAr:"العربیه", langEn:"English",
    themeDark:"تیره", themeNeon:"نئون",
    helpText:"مربع‌های قرمز (دشمنان) را نابود کنید و امتیاز بگیرید",
    footerTitle:"دفاع فضایی", footerContributors:"مشارکت کنندگان",
    langTitle:"انتخاب زبان", closeBtn:"بستن",
    level:"مرحله"
  },
  ar: {
    title:"الدفاع الفضائي", score:"النقاط", start:"بدء اللعبة",
    settings:"الإعدادات", help:"مساعدة",
    sideReturn:"العودة إلى القائمة", sideSettings:"الإعدادات", sideHelp:"مساعدة",
    resetBtn:"🔄 إعادة تعيين", backBtn:"رجوع",
    langFa:"فارسی", langAr:"العربية", langEn:"English",
    themeDark:"داكن", themeNeon:"نيون",
    helpText:"دمّر المربعات الحمراء (الأعداء) واحصل على النقاط",
    footerTitle:"الدفاع الفضائي", footerContributors:"المساهمون",
    langTitle:"اختيار اللغة", closeBtn:"إغلاق",
    level:"المستوى"
  },
  en: {
    title:"Space Defense", score:"Score", start:"Start Game",
    settings:"Settings", help:"Help",
    sideReturn:"Back to Menu", sideSettings:"Settings", sideHelp:"Help",
    resetBtn:"🔄 Reset Progress", backBtn:"Back",
    langFa:"Persian", langAr:"Arabic", langEn:"English",
    themeDark:"Dark", themeNeon:"Neon",
    helpText:"Destroy red squares (enemies) and earn points!",
    footerTitle:"Space Defense", footerContributors:"Contributors",
    langTitle:"Choose Language", closeBtn:"Close",
    level:"Level"
  }
};

function applyLang(lang) {
  var t = trans[lang];
  document.getElementById('msg').innerText = t.title;
  document.getElementById('startBtn').innerText = t.start;
  document.getElementById('scoreDisplay').innerText = t.score + ': ' + score;
  document.getElementById('setTxt').innerText = t.settings;
  document.getElementById('helpTxt').innerText = t.help;
  document.getElementById('helpContent').innerText = t.helpText;
  document.getElementById('helpBackBtn').innerText = t.backBtn;
  document.getElementById('backBtn').innerText = t.backBtn;
  document.getElementById('resetBtn').innerText = t.resetBtn;
  document.getElementById('langFaBtn').innerText = t.langFa;
  document.getElementById('langArBtn').innerText = t.langAr;
  document.getElementById('langEnBtn').innerText = t.langEn;
  document.getElementById('themeDarkBtn').innerText = t.themeDark;
  document.getElementById('themeNeonBtn').innerText = t.themeNeon;
  document.getElementById('footerTitle').innerText = t.footerTitle;
  document.getElementById('footerContributors').innerText = t.footerContributors;
  document.getElementById('langTitle').innerText = t.langTitle;
  document.getElementById('langCloseBtn').innerText = t.closeBtn;
  document.getElementById('levelDisplay').innerText = t.level + ': ' + level;
  document.getElementById('htmlTag').dir = (lang === 'en') ? 'ltr' : 'rtl';
  var f = document.getElementById('currentFlag');
  if (lang === 'fa') f.innerText = '\uD83C\uDDEE\uD83C\uDDF7';
  else if (lang === 'ar') f.innerText = '\uD83C\uDDF5\uD83C\uDDF8';
  else f.innerText = '\uD83C\uDDFA\uD83C\uDDF8';
  // side menu items
  var sideItems = document.querySelectorAll('.side-item');
  sideItems[0].querySelector('span:last-child').innerText = t.sideReturn;
  sideItems[1].querySelector('span:last-child').innerText = t.sideSettings;
  sideItems[2].querySelector('span:last-child').innerText = t.sideHelp;
}

function setLang(lang) { currentLang = lang; applyLang(lang); }
function selectLang(lang) { setLang(lang); closeLangMenu(); }
function setTheme(c) {
  document.getElementById('settingsPanel').className = 'menu-overlay ' + c;
}

function checkLevel() {
  var newLevel = Math.floor(score / SCORE_PER_LEVEL) + 1;
  if (newLevel > level) {
    level = newLevel;
    document.getElementById('levelDisplay').textContent = trans[currentLang].level + ': ' + level;
    showLevelUp();
    increaseDifficulty();
    saveProgress();
  }
}

function showLevelUp() {
  try {
    var msg = document.createElement('div');
    msg.textContent = '\uD83C\uDF89 ' + trans[currentLang].level + ' ' + level + '!';
    msg.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:bold;color:#FFD700;text-shadow:3px 3px 8px #000;pointer-events:none;z-index:999;animation:levelUp 1.2s ease-out forwards;';
    document.body.appendChild(msg);
    setTimeout(function(){ msg.remove(); }, 1500);
  } catch(e) {}
}

function increaseDifficulty() {
  window.enemySpeed = 1.5 + (level * 0.25);
  window.spawnRate = Math.max(400, 1100 - (level * 60));
}

function saveProgress() {
  try { localStorage.setItem('score', String(score)); localStorage.setItem('level', String(level)); } catch(e) {}
}

function loadProgress() {
  try {
    var s = localStorage.getItem('score');
    var l = localStorage.getItem('level');
    if (s && !isNaN(parseInt(s))) score = parseInt(s);
    if (l && !isNaN(parseInt(l))) level = parseInt(l);
  } catch(e) { score = 0; level = 1; }
  document.getElementById('scoreDisplay').textContent = trans[currentLang].score + ': ' + score;
  document.getElementById('levelDisplay').textContent = trans[currentLang].level + ': ' + level;
  increaseDifficulty();
}

function resetProgress() {
  try { localStorage.removeItem('score'); localStorage.removeItem('level'); } catch(e) {}
  score = 0; level = 1;
  document.getElementById('scoreDisplay').innerText = trans[currentLang].score + ': 0';
  document.getElementById('levelDisplay').innerText = trans[currentLang].level + ': 1';
  increaseDifficulty();
}

function openSideMenu() {
  document.getElementById('sideMenu').classList.add('open');
  document.getElementById('sideBackdrop').classList.add('open');
}
function closeSideMenu() {
  document.getElementById('sideMenu').classList.remove('open');
  document.getElementById('sideBackdrop').classList.remove('open');
}
function returnToMenu() {
  isRunning = false;
  document.getElementById('mainMenu').classList.remove('hidden');
  closeSideMenu();
}
function openSettings() {
  closeSideMenu();
  document.getElementById('settingsPanel').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settingsPanel').classList.add('hidden');
}
function openHelp() {
  closeSideMenu();
  document.getElementById('helpPanel').classList.remove('hidden');
}
function closeHelp() {
  document.getElementById('helpPanel').classList.add('hidden');
}
function openLangMenu() { document.getElementById('langMenu').classList.remove('hidden'); }
function closeLangMenu() { document.getElementById('langMenu').classList.add('hidden'); }

function startGame() {
  try { saveProgress(); } catch(e) {}
  enemies = [];
  bullets = [];
  isRunning = true;
  loadProgress();
  document.getElementById('mainMenu').classList.add('hidden');
  loop();
}

// controls
var leftBtn = document.getElementById('leftBtn');
var rightBtn = document.getElementById('rightBtn');
var shootBtn = document.getElementById('shootBtn');

leftBtn.addEventListener('pointerdown', function(){ keys.l = true; });
leftBtn.addEventListener('pointerup',   function(){ keys.l = false; });
leftBtn.addEventListener('touchstart',  function(e){ e.preventDefault(); keys.l = true; });
leftBtn.addEventListener('touchend',    function(){ keys.l = false; });
rightBtn.addEventListener('pointerdown', function(){ keys.r = true; });
rightBtn.addEventListener('pointerup',   function(){ keys.r = false; });
rightBtn.addEventListener('touchstart',  function(e){ e.preventDefault(); keys.r = true; });
rightBtn.addEventListener('touchend',    function(){ keys.r = false; });
shootBtn.addEventListener('pointerdown', function(){
  if (isRunning) bullets.push({x: playerX + 17, y: playerY});
});

window.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft') keys.l = true;
  if (e.key === 'ArrowRight') keys.r = true;
  if (e.key === ' ' && isRunning) { e.preventDefault(); bullets.push({x: playerX + 17, y: playerY}); }
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowLeft') keys.l = false;
  if (e.key === 'ArrowRight') keys.r = false;
});

function loop() {
  if (!isRunning) return;
  if (keys.l && playerX > 0) playerX -= 6;
  if (keys.r && playerX < 260) playerX += 6;

  var spawnChance = 0.02 * (1 + level * 0.15);
  if (Math.random() < spawnChance) {
    enemies.push({x: Math.random() * 270, y: 0});
  }

  ctx.clearRect(0, 0, 300, 300);

  for (var i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    e.y += window.enemySpeed;
    ctx.fillStyle = 'red';
    ctx.fillRect(e.x, e.y, 20, 20);
    if (e.y > playerY - 10 && e.x < playerX + 40 && e.x + 20 > playerX) {
      isRunning = false;
      try { saveProgress(); } catch(err) {}
      document.getElementById('mainMenu').classList.remove('hidden');
      return;
    }
    if (e.y > 300) enemies.splice(i, 1);
  }

  for (var j = bullets.length - 1; j >= 0; j--) {
    var b = bullets[j];
    b.y -= 7;
    ctx.fillStyle = 'yellow';
    ctx.fillRect(b.x, b.y, 5, 10);
    for (var k = enemies.length - 1; k >= 0; k--) {
      var em = enemies[k];
      if (b.y < em.y + 20 && b.x > em.x && b.x < em.x + 20) {
        score += 10;
        document.getElementById('scoreDisplay').innerText = trans[currentLang].score + ': ' + score;
        checkLevel();
        enemies.splice(k, 1);
        bullets.splice(j, 1);
        break;
      }
    }
    if (b.y < 0) bullets.splice(j, 1);
  }

  ctx.fillStyle = '#00d2ff';
  ctx.fillRect(playerX, playerY, 40, 10);

  requestAnimationFrame(loop);
}

// بارگذاری اولیه
loadProgress();
applyLang('fa');
console.log('Space Defense loaded!');
</script>
</body>
</html>

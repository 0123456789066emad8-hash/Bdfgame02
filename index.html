<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Defense</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: linear-gradient(45deg, #ff007f, #00d2ff, #7f00ff); 
            background-size: 300% 300%; 
            animation: gradientBG 8s ease infinite; 
            color: white; 
            font-family: Tahoma, sans-serif; 
            min-height: 100vh; 
            overflow: hidden; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        
        :root { --bg-color: rgba(0,0,0,0.85); --text-color: white; }
        
        .info-bar { 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 20px; 
            background-color: rgba(0, 0, 0, 0.4); 
            box-sizing: border-box; 
            flex-shrink: 0;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            width: 28px;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: white;
            border-radius: 2px;
            transition: 0.2s;
        }
        .game-container { 
            position: relative; 
            margin-top: 20px; 
        }
        #gameCanvas { 
            background: rgba(0, 0, 0, 0.5); 
            border: 2px solid #fff; 
            border-radius: 10px; 
            display: block; 
        }
        
        .menu-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            border-radius: 10px; 
        }
        .hidden { display: none !important; }

        .btn { 
            padding: 8px 12px; 
            margin: 5px; 
            border: 1px solid currentColor; 
            border-radius: 8px; 
            cursor: pointer; 
            background: transparent; 
            color: inherit; 
            font-size: 14px; 
        }

        .controls { 
            display: flex; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .ctrl-btn { 
            padding: 15px 25px; 
            background: rgba(255, 255, 255, 0.2); 
            border: 2px solid white; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 24px; 
        }

        /* ===== نوار طوسی پایین ===== */
        .lang-bar {
            width: 100%;
            margin-top: auto;
            background: #555;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            border-top: 1px solid #444;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .footer-text { flex: 1; text-align: center; }
        .footer-text .main { font-size: 14px; font-weight: 700; }
        .footer-text .sub { font-size: 11px; opacity: 0.75; margin-top: 2px; }
        #currentFlag { font-size: 28px; cursor: pointer; padding: 4px 6px; }

        /* ===== منوی کشویی از چپ (مثل OpenBattle) ===== */
        .side-backdrop {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .side-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .side-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: linear-gradient(180deg, #0d1b2a 0%, #1b2838 50%, #0d1b2a 100%);
            z-index: 100;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.5);
        }
        .side-menu.open { left: 0; }

        .side-menu-header {
            padding: 30px 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            color: #4da6ff;
            letter-spacing: 2px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-logo .icon {
            width: 28px;
            height: 28px;
            border: 2px solid #4da6ff;
            border-radius: 4px;
            position: relative;
        }
        .brand-logo .icon::before {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 10px; height: 10px;
            border: 2px solid #4da6ff;
            border-right: none;
            border-bottom: none;
        }

        .side-menu-items {
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .side-item {
            width: 85%;
            padding: 16px 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            border-radius: 8px;
            margin: 4px 0;
            transition: background 0.2s;
        }
        .side-item:hover { background: rgba(77, 166, 255, 0.1); }
        .side-item:active { background: rgba(77, 166, 255, 0.2); }
        .side-item .ico {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }
        .side-item.active {
            color: #4da6ff;
        }
    </style>
</head>
<body>

    <div class="info-bar">
        <span id="scoreDisplay" style="font-weight:bold">امتیاز: 0</span>
        <span id="brand" style="color:#4da6ff; font-weight:900; letter-spacing:1px; font-family:'Segoe UI',Arial,sans-serif">Bdfgame</span>
        <div class="hamburger" onclick="openSideMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="300"></canvas>

        <div id="mainMenu" class="menu-overlay">
            <h2 id="msg">دفاع فضایی</h2>
            <button class="btn" onclick="startGame()" id="startBtn">شروع بازی</button>
        </div>

        <!-- منوی تنظیمات داخلی -->
        <div id="settingsPanel" class="menu-overlay hidden">
            <h3 id="setTxt">تنظیمات</h3>
            <div>
                <button class="btn" onclick="setLang('fa')">فارسی</button>
                <button class="btn" onclick="setLang('ar')">العربیه</button>
                <button class="btn" onclick="setLang('en')">English</button>
            </div>
            <div style="margin-top:10px">
                <button class="btn" onclick="setTheme('theme-dark')">Dark</button>
                <button class="btn" onclick="setTheme('theme-neon')">Neon</button>
            </div>
            <button class="btn" onclick="closeSettings()">بازگشت</button>
        </div>

        <!-- منوی راهنما -->
        <div id="helpPanel" class="menu-overlay hidden">
            <h3 id="helpTxt">راهنما</h3>
            <p style="text-align:center; line-height:1.8; max-width:85%; margin-top:12px; font-size:15px;">
                مربع‌های قرمز (دشمنان) را نابود کنید و امتیاز بگیرید
            </p>
            <button class="btn" onclick="closeHelp()" style="margin-top:16px">بازگشت</button>
        </div>
    </div>

    <div class="controls">
        <div class="ctrl-btn" id="leftBtn">◀️</div>
        <div class="ctrl-btn" id="shootBtn">🚀</div>
        <div class="ctrl-btn" id="rightBtn">▶️</div>
    </div>

    <div class="lang-bar">
        <div style="width:40px;"></div>
        <div class="footer-text">
            <div id="footerTitle" class="main">دفاع فضایی</div>
            <div id="footerContributors" class="sub">مشارکت کنندگان</div>
        </div>
        <div style="width:40px; text-align:left;">
            <span id="currentFlag" onclick="openLangMenu()">🇮🇷</span>
        </div>
    </div>

    <!-- منوی انتخاب زبان -->
    <div id="langMenu" class="menu-overlay hidden">
        <h3 id="langTitle">انتخاب زبان</h3>
        <div style="display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;">
            <button class="btn" onclick="selectLang('fa')" style="font-size: 36px;">🇮🇷</button>
            <button class="btn" onclick="selectLang('ar')" style="font-size: 36px;">🇵🇸</button>
            <button class="btn" onclick="selectLang('en')" style="font-size: 36px;">🇺🇸</button>
        </div>
        <button class="btn" onclick="closeLangMenu()" style="margin-top: 20px;">بستن</button>
    </div>

    <!-- ===== منوی کشویی از سمت چپ ===== -->
    <div class="side-backdrop" id="sideBackdrop" onclick="closeSideMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <div class="brand-logo">
                <span class="icon"></span>
                <span>Bdfgame</span>
            </div>
        </div>
        <div class="side-menu-items">
            <div class="side-item" onclick="returnToMenu()">
                <span class="ico">🎮</span>
                <span>بازگشت به منوی بازی</span>
            </div>
            <div class="side-item" onclick="openSettings()">
                <span class="ico">⚙️</span>
                <span>تنظیمات</span>
            </div>
            <div class="side-item" onclick="openHelp()">
                <span class="ico">📖</span>
                <span>راهنما</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
        let playerX = 130, score = 0, isRunning = false, currentLang = 'fa';
        let enemies = [], bullets = [], keys = {l: false, r: false};

        window.addEventListener("keydown", (e) => {
            if(e.key === "ArrowLeft") keys.l = true;
            if(e.key === "ArrowRight") keys.r = true;
            if(e.key === " " && isRunning) bullets.push({x: playerX + 17, y: 270});
        });
        window.addEventListener("keyup", (e) => {
            if(e.key === "ArrowLeft") keys.l = false;
            if(e.key === "ArrowRight") keys.r = false;
        });

        const trans = {
            fa: { title: "دفاع فضایی", score: "امتیاز", start: "شروع بازی", settings: "تنظیمات", help: "راهنما", returnMenu: "بازگشت به منوی بازی" },
            ar: { title: "الدفاع الفضائي", score: "النقاط", start: "بدء اللعبة", settings: "الإعدادات", help: "مساعدة", returnMenu: "العودة للقائمة" },
            en: { title: "Space Defense", score: "Score", start: "Start Game", settings: "Settings", help: "Help", returnMenu: "Return to Menu" }
        };

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('msg').innerText = trans[lang].title;
            document.getElementById('startBtn').innerText = trans[lang].start;
            document.getElementById('scoreDisplay').innerText = trans[lang].score + ": " + score;
            document.getElementById('setTxt').innerText = trans[lang].settings;
            document.getElementById('helpTxt').innerText = trans[lang].help;
            document.getElementById('htmlTag').dir = (lang === 'en') ? 'ltr' : 'rtl';
            const flagEl = document.getElementById('currentFlag');
            if (lang === 'fa') flagEl.innerText = '🇮🇷';
            else if (lang === 'ar') flagEl.innerText = '🇵🇸';
            else flagEl.innerText = '🇺🇸';
        }
        function selectLang(lang) { setLang(lang); closeLangMenu(); }

        function setTheme(c) { 
            document.getElementById('settingsPanel').className = 'menu-overlay ' + c; 
        }

        // ===== منوی کشویی =====
        function openSideMenu() {
            document.getElementById('sideMenu').classList.add('open');
            document.getElementById('sideBackdrop').classList.add('open');
        }
        function closeSideMenu() {
            document.getElementById('sideMenu').classList.remove('open');
            document.getElementById('sideBackdrop').classList.remove('open');
        }

        // بازگشت به منوی بازی
        function returnToMenu() {
            isRunning = false;
            document.getElementById("mainMenu").classList.remove("hidden");
            closeSideMenu();
        }

        // تنظیمات از منوی کشویی
        function openSettings() {
            closeSideMenu();
            document.getElementById('settingsPanel').classList.remove('hidden');
        }
        function closeSettings() {
            document.getElementById('settingsPanel').classList.add('hidden');
        }

        // راهنما از منوی کشویی
        function openHelp() {
            closeSideMenu();
            document.getElementById('helpPanel').classList.remove('hidden');
        }
        function closeHelp() {
            document.getElementById('helpPanel').classList.add('hidden');
        }

        // منوی زبان
        function openLangMenu() { document.getElementById('langMenu').classList.remove('hidden'); }
        function closeLangMenu() { document.getElementById('langMenu').classList.add('hidden'); }

        document.getElementById("leftBtn").onpointerdown = () => keys.l = true;
        document.getElementById("leftBtn").onpointerup = () => keys.l = false;
        document.getElementById("rightBtn").onpointerdown = () => keys.r = true;
        document.getElementById("rightBtn").onpointerup = () => keys.r = false;
        document.getElementById("shootBtn").onclick = () => { if(isRunning) bullets.push({x: playerX + 17, y: 270}); };

        function startGame() {
            score = 0; enemies = []; bullets = []; isRunning = true;
            document.getElementById("mainMenu").classList.add("hidden");
            loop();
        }

        function loop() {
            if (!isRunning) return;
            if (keys.l && playerX > 0) playerX -= 6;
            if (keys.r && playerX < 260) playerX += 6;
            if(Math.random() < 0.02) enemies.push({x: Math.random()*270, y: 0});

            ctx.clearRect(0, 0, 300, 300);
            enemies.forEach((e, i) => {
                e.y += 1.5;
                ctx.fillStyle = "red"; ctx.fillRect(e.x, e.y, 20, 20);
                if (e.y > 270 && e.x < playerX + 40 && e.x + 20 > playerX) {
                    isRunning = false; document.getElementById("mainMenu").classList.remove("hidden");
                }
                if(e.y > 300) enemies.splice(i, 1);
            });

            bullets.forEach((b, i) => {
                b.y -= 7;
                ctx.fillStyle = "yellow"; ctx.fillRect(b.x, b.y, 5, 10);
                enemies.forEach((e, ei) => {
                    if (b.y < e.y + 20 && b.x > e.x && b.x < e.x + 20) {
                        score += 10;
                        document.getElementById('scoreDisplay').innerText = trans[currentLang].score + ": " + score;
                        enemies.splice(ei, 1); bullets.splice(i, 1);
                    }
                });
                if(b.y < 0) bullets.splice(i, 1);
            });

            ctx.fillStyle = "#00d2ff"; ctx.fillRect(playerX, 280, 40, 10);
            requestAnimationFrame(loop);
        }
    </script>
</body>
    </html>
